[project]
name = "minemark"
version = "0.1.0"
description = "Open-source aerial ordnance triage: drone imagery -> AI candidates -> human review -> georeferenced hazard map"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "transformers>=4.43,<5",
    "pillow>=10.0",
    "piexif>=1.1.3",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
geotiff = ["rasterio>=1.3", "pyproj>=3.6"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
minemark = "backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
